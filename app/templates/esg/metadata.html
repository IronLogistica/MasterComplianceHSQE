{% extends 'base.html' %}{% block content %}<h1>Metadati del rapporto</h1><form method="post" class="card inner"><label>Titolo<input name="title" value="{{report.title}}"></label><label>Ragione sociale<input name="legal_name" value="{{report.legal_name or ''}}"></label><label>Tipo<input name="report_type" value="{{report.report_type}}"></label><div class="grid2"><label>Inizio periodo<input type="date" name="reporting_period_start" value="{{report.reporting_period_start or ''}}"></label><label>Fine periodo<input type="date" name="reporting_period_end" value="{{report.reporting_period_end or ''}}"></label></div><label>Perimetro<textarea name="reporting_boundary">{{report.reporting_boundary or ''}}</textarea></label><label>Riferimenti<input name="reporting_framework" value="{{report.reporting_framework or ''}}"></label><label>Nota metodologica<textarea name="methodology_note">{{report.methodology_note or ''}}</textarea></label><label>Dichiarazione direzione<textarea name="management_statement">{{report.management_statement or ''}}</textarea></label><button class="btn primary">Salva</button></form>{% endblock %}
