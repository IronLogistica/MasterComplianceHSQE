{% extends 'base.html' %}{% block title %}Clienti ESG{% endblock %}{% block content %}<p class="eyebrow">ESG · Passo 1</p><h1>Anagrafiche clienti</h1><nav class="subnav"><a class="btn" href="{{url_for('esg.reports')}}">Rapporti</a></nav><form method="get" class="inline-form"><label>Cerca<input name="q" value="{{q}}"></label><button class="btn">Filtra</button></form><section class="list">{% for c in items %}<article class="card"><form method="post" action="{{url_for('esg.edit_customer',customer_id=c.id)}}" class="inner"><div class="grid2"><label>Ragione sociale<input name="legal_name" value="{{c.legal_name}}" required></label><label>CF/P.IVA<input name="tax_id" value="{{c.tax_id or ''}}"></label></div><div class="grid2"><label>Settore<input name="sector" value="{{c.sector or ''}}"></label><label>Indirizzo<input name="address" value="{{c.address or ''}}"></label></div><div class="grid2"><label>Referente<input name="contact_name" value="{{c.contact_name or ''}}"></label><label>Email<input type="email" name="contact_email" value="{{c.contact_email or ''}}"></label></div><label>Note<textarea name="notes">{{c.notes or ''}}</textarea></label><button class="btn success">Salva</button></form><form method="post" action="{{url_for('esg.delete_customer',customer_id=c.id)}}"><button class="btn danger">Elimina</button></form></article>{% endfor %}</section><section class="card"><h2>Nuovo cliente</h2><form method="post" class="inner"><div class="grid2"><label>Ragione sociale<input name="legal_name" required></label><label>CF/P.IVA<input name="tax_id"></label></div><div class="grid2"><label>Settore<input name="sector"></label><label>Addetti<input type="number" min="0" name="employees"></label></div><label>Indirizzo<input name="address"></label><div class="grid2"><label>Referente<input name="contact_name"></label><label>Email<input type="email" name="contact_email"></label></div><label>Telefono<input name="phone"></label><label>Note<textarea name="notes"></textarea></label><button class="btn primary">Crea anagrafica</button></form></section>{% endblock %}
