{% extends 'base.html' %}{% block content %}<p class="eyebrow">ESG {{report.year}} · Passo 2 di 4</p><h1>Raccolta dati ed evidenze</h1><nav class="subnav"><a class="btn" href="{{url_for('esg.report_customer',report_id=report.id)}}">← Cliente</a><a class="btn primary" href="{{url_for('esg.metrics',report_id=report.id)}}">Avanti: KPI →</a></nav><form method="get" class="card inline-form"><label>Ricerca<input name="q" value="{{q}}"></label><label>Categoria<input name="categoria" value="{{category}}"></label><button class="btn">Filtra</button></form><section class="list" style="margin-top:14px">{% for e in items %}<article class="card"><form method="post" action="{{url_for('esg.edit_evidence',evidence_id=e.id)}}" class="inner"><div class="grid2"><label>Titolo<input name="title" value="{{e.title}}"></label><label>Categoria<input name="category" value="{{e.category}}"></label></div><div class="grid2"><label>Periodo<input name="period" value="{{e.period or ''}}"></label><label>Fonte<input name="source" value="{{e.source or ''}}"></label></div><label>Note<textarea name="note">{{e.note or ''}}</textarea></label><div class="row"><a class="btn" target="_blank" href="{{url_for('static',filename=e.file_path)}}">Apri file</a><button class="btn success">Salva</button></div></form><form method="post" action="{{url_for('esg.delete_esg_evidence',evidence_id=e.id)}}"><button class="btn danger">Elimina</button></form></article>{% else %}<div class="empty">Nessuna evidenza raccolta.</div>{% endfor %}</section><section class="card"><h2>+ Raccogli evidenza</h2><form method="post" enctype="multipart/form-data" class="inner"><div class="grid2"><label>Titolo<input name="title" required></label><label>Categoria<select name="category"><option>ambiente</option><option>persone</option><option>governance</option><option>economico</option><option>altro</option></select></label></div><div class="grid2"><label>Periodo<input name="period"></label><label>Fonte/input owner<input name="source"></label></div><label>Collega a KPI<select name="metric_id"><option value="">Nessuno</option>{% for m in report.metrics %}<option value="{{m.id}}">{{m.code}} · {{m.name}}</option>{% endfor %}</select></label><label>File<input type="file" name="file" required></label><label>Note<textarea name="note"></textarea></label><button class="btn primary">Carica evidenza</button></form></section>{% endblock %}
