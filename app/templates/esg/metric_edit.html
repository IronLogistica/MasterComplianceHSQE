{% extends 'base.html' %}{% block content %}<p class="eyebrow">ESG {{report.year}} · Passo 3 di 4</p><h1>Modifica KPI</h1><form method="post" class="card inner"><label>Nome<input name="name" value="{{metric.name}}" required></label><div class="grid2"><label>Valore<input type="number" step="any" name="value" value="{{metric.value if metric.value is not none else ''}}"></label><label>Precedente<input type="number" step="any" name="previous_value" value="{{metric.previous_value if metric.previous_value is not none else ''}}"></label></div><div class="grid2"><label>Target<input type="number" step="any" name="target_value" value="{{metric.target_value if metric.target_value is not none else ''}}"></label><label>Unità<input name="unit" value="{{metric.unit or ''}}"></label></div><label>Qualità<select name="data_quality">{% for q in ['ND','stimato','misurato'] %}<option {{'selected' if metric.data_quality==q}}>{{q}}</option>{% endfor %}</select></label><label>Metodologia<textarea name="methodology">{{metric.methodology or ''}}</textarea></label><label>Fonte/evidenza<textarea name="source_ref">{{metric.source_ref or ''}}</textarea></label><label>Data owner<input name="data_owner" value="{{metric.data_owner or ''}}"></label><label>Note<textarea name="note">{{metric.note or ''}}</textarea></label><button class="btn success">Salva KPI</button></form><nav class="subnav"><a class="btn" href="{{url_for('esg.metrics',report_id=report.id)}}">← KPI</a><a class="btn primary" href="{{url_for('esg.report_print',report_id=report.id)}}">Avanti: revisione →</a></nav>{% endblock %}
