{% extends 'base.html' %}{% block title %}Calendario manutenzioni{% endblock %}{% block content %}<div class="intro"><p class="eyebrow">AREA TITOLARE</p><h1>Scadenzario manutenzioni</h1></div><nav class="subnav"><a href="{{ url_for('maintenance.dashboard') }}" class="btn">Dashboard</a><a href="{{ url_for('maintenance.pipeline') }}" class="btn">Pipeline</a><a href="{{ url_for('maintenance.calendar_view') }}" class="btn primary">Calendario</a></nav><div class="card"><div id="calendar"></div></div><link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script><script>document.addEventListener('DOMContentLoaded',function(){var el=document.getElementById('calendar');var cal=new FullCalendar.Calendar(el,{initialView:'dayGridMonth',locale:'it',height:'auto',headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek'},events:'{{ url_for("maintenance.api_due") }}',eventClick:function(info){window.location.href='/maintenance/machines/'+info.event.id;}});cal.render();});</script>{% endblock %}
